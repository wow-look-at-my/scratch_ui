name: Deploy site

# Publishes the site surface described by pages-manifest.json to buildhost as a
# public static site, using buildhost's own buildhost-publish-site action for
# the upload (tar.gz PUT to sites.pazer.build, GitHub OIDC auth — no static
# secrets). The manifest — not this workflow — decides what gets published; the
# assembly step just executes it.
#
#   push to master    -> https://sites.pazer.build/scratch_ui/branch/master/
#                        (the canonical consumer site)
#   pull_request      -> https://sites.pazer.build/scratch_ui/branch/pr-<number>/

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize]

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

permissions:
  contents: read
  id-token: write # buildhost OIDC auth
  # The buildhost-publish-site action (consumed @master) now front-runs the
  # org's no-all-builds shadow guard, which scans this run's jobs and the
  # head commit's check runs — it FAILS CLOSED without these two reads.
  actions: read
  checks: read
  # buildhost-publish-site records what it uploaded on the org's linked
  # artifacts page; that recording is part of publishing, not optional,
  # so the publish fails without this.
  artifact-metadata: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs get no OIDC token, so they cannot authenticate to buildhost.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      # Compiles src/components/<name>/<name>.ts (+ its .css) -> dist/, which
      # is what the manifest publishes, and scripts/ -> dist-scripts/.
      # `pnpm install` also builds via `prepare`; this makes the dependency
      # explicit and fails loudly.
      - run: pnpm install

      - name: Build
        run: pnpm build

      # Reads pages-manifest.json and stages _site/ (input -> output copies).
      - name: Assemble _site/ from pages-manifest.json
        run: node dist-scripts/assemble-pages.js

      # Same branch naming as the org's buildhost-preview.yml reusable
      # workflow: pr-<number> for pull requests, the pushed ref otherwise.
      - name: Publish _site/ to buildhost
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          branch: ${{ github.event.number && format('pr-{0}', github.event.number) || github.ref_name }}
          source_dir: _site
          public: 'true'
