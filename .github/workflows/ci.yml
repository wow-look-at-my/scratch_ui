name: CI

on:
  push:

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm, pinned via package.json "packageManager" and provisioned by
      # corepack (ships with Node) — no third-party setup action needed.
      - name: Enable pnpm
        run: corepack enable

      # No lockfile is committed (so ts0 is never pinned to a commit) — `pnpm
      # install` resolves the ts0 branch dependency to its current HEAD on every
      # run. ts0's git-dep build script is allowlisted via package.json
      # "pnpm.onlyBuiltDependencies". The postinstall `prepare` script builds.
      - run: pnpm install

      # ts0 build type-checks (tsc --noEmit, strict, `any` rejected) every
      # component and compiles src/components/ -> dist/. A type error fails CI.
      - name: Build components
        run: pnpm build

      # ts0's own check covers what it builds. This one adds the build scripts,
      # which run under Node's type stripping — stripping never type-checks, so
      # nothing else would catch a type error in them.
      - name: Type-check the build scripts
        run: pnpm typecheck

      # Executes pages-manifest.json into _site/, which also enforces that
      # every component under src/components/ has a published entry — the
      # check that stops a new component from being silently unpublished.
      - name: Assemble the site from pages-manifest.json
        run: node .github/scripts/assemble-pages.ts

      # The site deploy manifest must satisfy its checked-in JSON Schema
      # (pages-manifest.schema.json mirrors the assembly script's constraints).
      - name: Validate pages-manifest.json against its schema
        uses: wow-look-at-my/json-validator@master
        with:
          files: 'pages-manifest.json'
          schema: 'pages-manifest.schema.json'

  # Zero-work fan-in of every job in this workflow. always() keeps it reporting
  # when a needed job fails or is skipped; it fails on any failure/cancelled
  # result and passes on success/skipped. Deliberately NOT named `all-builds`:
  # the org's required all-builds gate is a commit status posted by the
  # required-builds-manager app, which aggregates every build on the SHA
  # itself — a workflow job with that name only shadows the real gate in the
  # GitHub UI, and the buildhost publish guard fails any deploy on a SHA
  # carrying one (see preview.yml's permissions comment).
  aggregate:
    needs: [build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: wow-look-at-my/actions@typescript#latest
        with:
          needs: ${{ toJSON(needs) }}
          script: |
            const results = Object.entries(needs).map(([job, n]) => [job, n.result] as const);
            for (const [job, result] of results) core.info(`${job}: ${result}`);
            const bad = results.filter(([, r]) => r === "failure" || r === "cancelled");
            if (bad.length > 0) {
              core.setFailed(`Jobs failed or were cancelled: ${bad.map(([j]) => j).join(", ")}`);
            }
