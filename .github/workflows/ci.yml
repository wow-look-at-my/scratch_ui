name: CI

# Build, verify and publish, in one job. Why that shape, and why these triggers: CLAUDE.md.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize]

# Serializes publish by ref: a slow build must never overwrite a later commit's. See CLAUDE.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # buildhost OIDC auth
  # The publish guard scans jobs and check runs, and FAILS CLOSED without both of these reads.
  actions: read
  checks: read
  # Recording the upload on the org's artifacts page is part of publishing, with no opt-out.
  artifact-metadata: write
  deployments: write

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@common-checks#latest

      # Every .md file, this action's own default for `files`. A paragraph here is one line.
      - name: Lint prose against the STE subset
        uses: wow-look-at-my/actions@ste-lint#latest

      # One invocation also builds scripts/, a nested ts0 project. The action takes no args.
      - name: Type-check, test and build
        uses: wow-look-at-my/ts0@master

      # Every stylesheet -> src/scratch-ui.css, each scoped to the element it styles.
      - name: Build stylesheet
        run: node dist-scripts/build-css.js

      # Also the check that every component under src/components/ is imported by src/index.ts.
      - name: Assemble _site/ from pages-manifest.json
        run: node dist-scripts/assemble-pages.js

      # pages-manifest.schema.json mirrors the assembly script's own constraints.
      - name: Validate pages-manifest.json against its schema
        uses: wow-look-at-my/json-validator@master
        with:
          files: 'pages-manifest.json'
          schema: 'pages-manifest.schema.json'

      # Only the publish is gated. A fork PR has no OIDC token, and still builds and verifies.
      - name: Publish _site/ to buildhost
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          branch: ${{ github.event.number && format('pr-{0}', github.event.number) || github.ref_name }}
          # github.sha is the merge commit here, which dies with the PR. Record the head.
          git_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          # A Deployment's ref is stored verbatim, and a bare SHA belongs to no branch.
          deployment_ref: ${{ github.head_ref || github.ref_name }}
          source_dir: _site
          public: 'true'
