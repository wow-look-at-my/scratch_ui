name: CI

# Build, verify, publish — one job, because every step feeds the next: the
# build produces what the manifest publishes, and the assemble step is also
# the check that every component IS published.
#
#   push to master    -> https://sites.pazer.build/scratch_ui/branch/master/
#                        (the canonical consumer site)
#   pull_request      -> https://sites.pazer.build/scratch_ui/branch/pr-<number>/
#
# Triggers are the deploy workflow's, kept as they were: the pull_request
# event is what supplies the PR number the preview site is named after, and
# `push` stays pinned to master so a PR update builds once, not twice.

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize]

# A push queues behind any run still building the same ref, so a slow build
# can never finish after and overwrite a later commit's publish (#28
# clobbered by the older, slower #26 build it was reverting). cancel-in-progress
# drops the superseded run instead of wasting a slot waiting to publish stale
# output.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # buildhost OIDC auth
  # The buildhost-publish-site action (consumed @master) front-runs the org's
  # no-all-builds shadow guard, which scans this run's jobs and the head
  # commit's check runs — it FAILS CLOSED without these two reads.
  actions: read
  checks: read
  # buildhost-publish-site records what it uploaded on the org's linked
  # artifacts page; that recording is part of publishing, not optional,
  # so the publish fails without this.
  artifact-metadata: write
  deployments: write

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # scripts/ is its own nested ts0 project (scripts/ts0.json), so one
      # `ts0 build` at the root recurses into it and produces dist-scripts/
      # alongside the root project's dist/scratch-ui.js.
      - name: Build scripts and bundle
        uses: wow-look-at-my/ts0@master
        with:
          args: build

      # Every stylesheet -> src/scratch-ui.css, each scoped to the element it
      # styles. Runs after both ts0 invocations above: css.d.ts's wildcard
      # `declare module '*.css'` type-checks src/styles.ts's import whether or
      # not the file exists yet, so only the ASSEMBLE step below needs it on
      # disk first.
      - name: Build stylesheet
        run: node dist-scripts/build-css.js

      # Executes pages-manifest.json into _site/, which also enforces that
      # every component under src/components/ is imported by src/index.ts —
      # the check that stops a new component from being silently left out of
      # the bundle.
      - name: Assemble _site/ from pages-manifest.json
        run: node dist-scripts/assemble-pages.js

      # The site deploy manifest must satisfy its checked-in JSON Schema
      # (pages-manifest.schema.json mirrors the assembly script's constraints).
      - name: Validate pages-manifest.json against its schema
        uses: wow-look-at-my/json-validator@master
        with:
          files: 'pages-manifest.json'
          schema: 'pages-manifest.schema.json'

      # Only the publish is gated: a fork PR gets no OIDC token and cannot
      # authenticate to buildhost, but it still builds and verifies above.
      - name: Publish _site/ to buildhost
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          branch: ${{ github.event.number && format('pr-{0}', github.event.number) || github.ref_name }}
          # On a pull_request event github.sha is the synthetic MERGE commit,
          # which stops existing when the PR closes. Record the PR head instead.
          git_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          # GitHub stores a Deployment's ref verbatim, and a bare SHA belongs to
          # no branch — the branch and PR deployment views then read "This branch
          # has not been deployed". head_ref is the PR's source branch and is
          # empty off pull_request, so this is the branch name in both cases.
          deployment_ref: ${{ github.head_ref || github.ref_name }}
          source_dir: _site
          public: 'true'